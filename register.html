<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — Maths League</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/global.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/auth.css"></head>
<body><main class="auth-page"><section class="auth-card"><a class="brand" href="index.html">Maths League</a><h1>Create your account</h1><p class="muted">Join the competition and start building your maths record.</p><form id="registerForm" novalidate><label>Full name<input id="fullName" autocomplete="name" required></label><label>Email<input id="email" type="email" autocomplete="email" required></label><label>Password<input id="password" type="password" autocomplete="new-password" minlength="6" required></label><label>School<input id="school" autocomplete="organization" required></label><label>State<input id="state" autocomplete="address-level1" required></label><button class="button button-primary" type="submit">Create account</button><p id="authMessage" class="form-message" role="status"></p></form><p class="auth-switch">Already registered? <a href="login.html">Sign in</a></p></section></main><script type="module" src="js/auth/register.js"></script></body></html>
