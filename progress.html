<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Progress | ML Trivia</title>

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/progress.css">

</head>


<body>

<main class="progress-page">


    <!-- HEADER -->

    <header class="progress-header">

        <div>

            <p class="eyebrow">
                MATHS LEAGUE
            </p>

            <h1>
                Your Progress
            </h1>

        </div>

        <button
            type="button"
            id="profileButton"
            class="header-profile"
        >

            <i class="ri-user-3-line"></i>

        </button>

    </header>



    <!-- LOADING -->

    <div
        class="progress-loading"
        id="progressLoading"
    >

        <i class="ri-loader-4-line"></i>

        <span>
            Loading your progress...
        </span>

    </div>



    <!-- MAIN CONTENT -->

    <section
        class="progress-content"
        id="progressContent"
    >


        <!-- STUDENT -->

        <div class="student-card">

            <div class="student-avatar">

                <i class="ri-user-3-line"></i>

            </div>

            <div>

                <span>
                    Student
                </span>

                <strong id="studentName">
                    Student
                </strong>

                <small id="registrationNumber">
                    MLTP00001
                </small>

            </div>

        </div>



        <!-- STATISTICS -->

        <div class="progress-stats">


            <div class="stat-card">

                <div class="stat-icon">
                    <i class="ri-star-line"></i>
                </div>

                <span>
                    Total Points
                </span>

                <strong id="totalPoints">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    <i class="ri-file-list-3-line"></i>
                </div>

                <span>
                    Quizzes
                </span>

                <strong id="quizzesCompleted">
                    0
                </strong>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    <i class="ri-percent-line"></i>
                </div>

                <span>
                    Average Score
                </span>

                <strong id="averageScore">
                    0%
                </strong>

            </div>


            <div class="stat-card">

                <div class="stat-icon">
                    <i class="ri-trophy-line"></i>
                </div>

                <span>
                    League Rank
                </span>

                <strong id="leagueRank">
                    —
                </strong>

            </div>

        </div>



        <!-- PERFORMANCE -->

        <section class="performance-section">

            <div class="section-heading">

                <div>

                    <p class="eyebrow">
                        PERFORMANCE
                    </p>

                    <h2>
                        Quiz History
                    </h2>

                </div>

            </div>


            <div
                class="quiz-history"
                id="quizHistory"
            >

                <!-- Generated by JavaScript -->

            </div>

        </section>


    </section>



    <!-- ERROR -->

    <div
        class="progress-error"
        id="progressError"
    ></div>



    <!-- BOTTOM NAVIGATION -->

    <nav class="bottom-nav">

        <button
            type="button"
            class="nav-item"
            data-page="home"
        >

            <i class="ri-home-5-line"></i>

            <span>
                Home
            </span>

        </button>


        <button
            type="button"
            class="nav-item"
            data-page="quiz"
        >

            <i class="ri-brain-line"></i>

            <span>
                Quiz
            </span>

        </button>


        <button
            type="button"
            class="nav-item active"
            data-page="progress"
        >

            <i class="ri-bar-chart-box-line"></i>

            <span>
                Progress
            </span>

        </button>


        <button
            type="button"
            class="nav-item"
            data-page="profile"
        >

            <i class="ri-user-3-line"></i>

            <span>
                Profile
            </span>

        </button>

    </nav>

</main>


<script
    type="module"
    src="js/progress.js"
></script>

</body>

</html>
