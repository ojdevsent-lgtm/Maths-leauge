<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Maths League</title>
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<main class="admin-page">
<header class="admin-header">
  <div>
    <p class="eyebrow">MATHS LEAGUE</p>
    <h1>Admin Dashboard</h1>
    <p>Restricted to authorized administrators.</p>
  </div>
  <div class="admin-actions">
    <a href="dashboard.html" class="admin-link"><i class="ri-arrow-left-line"></i> Student app</a>
    <button id="logoutButton" class="admin-link" type="button"><i class="ri-logout-box-r-line"></i> Log out</button>
  </div>
</header>

<div id="adminMessage" class="admin-message"></div>

<section class="admin-stats" aria-label="League statistics">
  <article><i class="ri-group-line"></i><div><span>Students</span><strong id="statStudents">0</strong></div></article>
  <article><i class="ri-file-list-3-line"></i><div><span>Quiz attempts</span><strong id="statAttempts">0</strong></div></article>
  <article><i class="ri-star-line"></i><div><span>Points awarded</span><strong id="statPoints">0</strong></div></article>
  <article><i class="ri-megaphone-line"></i><div><span>Active announcements</span><strong id="statAnnouncements">0</strong></div></article>
</section>

<section class="admin-panel active">
  <div class="panel-heading">
    <div><p class="eyebrow">RECENT ACTIVITY</p><h2>Latest quiz attempts</h2></div>
  </div>
  <div id="recentAttempts" class="admin-table-wrap"></div>
</section>

<section class="admin-panel active">
  <div class="panel-heading">
    <div><p class="eyebrow">STUDENT MANAGEMENT</p><h2>Registered students</h2></div>
    <input id="studentSearch" class="admin-search" type="search" placeholder="Search students..." autocomplete="off">
  </div>
  <div id="studentsTable" class="admin-table-wrap"></div>
</section>

<section class="admin-panel active">
  <div class="panel-heading">
    <div><p class="eyebrow">ANNOUNCEMENTS</p><h2>Published announcements</h2></div>
  </div>
  <div id="announcementsList" class="announcement-list"></div>
</section>

<script type="module" src="js/admin.js"></script>
</body>
</html>
