name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run functions smoke tests
        working-directory: functions
        run: npm test

      - name: Validate Firebase configuration
        run: npx --yes firebase-tools@latest use mltp-9f154 --non-interactive
