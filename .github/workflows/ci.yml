name: CI

on:
  pull_request:
  push:
    branches: [main, firebase-migration]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Check Cloud Functions syntax
        shell: bash
        run: |
          set -euo pipefail
          find functions -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Ensure Firebase platform modules exist
        shell: bash
        run: |
          set -euo pipefail
          test -f js/firebase.js
          test -f firebase.json
          test -f firestore.rules
          test -f firestore.indexes.json
          test -f functions/index.js
          test -f functions/package.json

      - name: Ensure active frontend imports use Firebase, not Supabase
        shell: bash
        run: |
          set -euo pipefail
          files=$(find js -type f -name '*.js' ! -path 'js/supabase.js')
          if grep -nHE 'from ["'"'].*supabase\.js|supabase\.auth|supabase\.from|supabase\.rpc' $files; then
            echo 'Active frontend JavaScript still imports or calls Supabase.'
            exit 1
          fi

      - name: Ensure Firebase config is not accidentally committed with a service-account key
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'private_key|client_email.*@.*iam\.gserviceaccount\.com|BEGIN PRIVATE KEY' . --exclude-dir=.git --exclude='*.md'; then
            echo 'A service-account credential appears to be committed.'
            exit 1
          fi

      - name: Ensure protected pages use the centralized session layer
        shell: bash
        run: |
          set -euo pipefail
          for file in js/profile.js js/progress.js js/dashboard.js; do
            grep -q 'core/session.js' "$file" || { echo "$file is missing the centralized session layer"; exit 1; }
          done
