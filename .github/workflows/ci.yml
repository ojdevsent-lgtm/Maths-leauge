name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package.json

      - name: Install legacy functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js functions -type d -name node_modules -prune -o -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Ensure frontend no longer imports Firebase client SDKs
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'gstatic\.com/firebase|from ["'"']\.\/firebase\.js["'"']' js --include='*.js'; then
            echo 'Legacy Firebase client imports remain in frontend JavaScript.'
            exit 1
          fi

      - name: Run legacy functions smoke tests
        working-directory: functions
        run: npm test

      - name: Validate legacy Firebase configuration JSON
        run: node -e "for (const file of ['firebase.json', '.firebaserc']) JSON.parse(require('fs').readFileSync(file, 'utf8')); console.log('Legacy Firebase configuration JSON is valid')"
