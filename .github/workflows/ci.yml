name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          find js -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Ensure legacy Firebase integration is removed
        shell: bash
        run: |
          set -euo pipefail
          test ! -e js/firebase.js
          test ! -e .firebaserc
          test ! -e firebase.json
          test ! -e firestore.rules
          test ! -d functions
          if grep -RInE 'gstatic\.com/firebase|firebase\.js|initializeApp\(|firebaseConfig' js --include='*.js'; then
            echo 'Legacy Firebase code remains in frontend JavaScript.'
            exit 1
          fi

      - name: Ensure protected pages use the centralized session layer
        shell: bash
        run: |
          set -euo pipefail
          for file in js/profile.js js/progress.js js/dashboard.js; do
            grep -q 'core/session.js' "$file" || { echo "$file is missing the centralized session layer"; exit 1; }
          done

      - name: Check required platform modules exist
        shell: bash
        run: |
          set -euo pipefail
          test -f js/core/session.js
          test -f js/services/student.service.js
          test -f js/services/quiz.service.js
          test -f docs/architecture.md
