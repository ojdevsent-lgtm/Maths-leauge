<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Authentication | ML Trivia</title>

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">

</head>

<body>

<main class="auth-page">

    <div class="auth-container">

        <!-- BACK -->

        <a href="index.html" class="auth-back">
            <i class="ri-arrow-left-line"></i>
            Back to Home
        </a>


        <!-- BRAND -->

        <div class="auth-brand">

            <div class="brand-mark">
                ML
            </div>

            <div>
                <h1>ML Trivia</h1>
                <span>Maths League</span>
            </div>

        </div>


        <!-- =========================
             SIGN UP
        ========================== -->

        <section
            class="auth-panel active"
            id="signupPanel"
        >

            <div class="auth-heading">

                <p class="eyebrow">
                    STUDENT REGISTRATION
                </p>

                <h2>Create your account.</h2>

                <p>
                    Join Maths League and begin
                    your mathematical journey.
                </p>

            </div>


            <form id="signupForm" class="auth-form">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <div class="input-wrapper">

                        <i class="ri-user-3-line"></i>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="signupEmail">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="ri-mail-line"></i>

                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <div class="input-wrapper">

                        <i class="ri-phone-line"></i>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="school">
                        School
                    </label>

                    <div class="input-wrapper">

                        <i class="ri-school-line"></i>

                        <input
                            type="text"
                            id="school"
                            placeholder="Enter your school"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <label for="state">
                        State
                    </label>

                    <div class="input-wrapper">

                        <i class="ri-map-pin-line"></i>

                        <select id="state" required>

                            <option value="">
                                Select your state
                            </option>

                            <option>Abia</option>
                            <option>Adamawa</option>
                            <option>Akwa Ibom</option>
                            <option>Anambra</option>
                            <option>Bauchi</option>
                            <option>Bayelsa</option>
                            <option>Benue</option>
                            <option>Borno</option>
                            <option>Cross River</option>
                            <option>Delta</option>
                            <option>Ebonyi</option>
                            <option>Edo</option>
                            <option>Ekiti</option>
                            <option>Enugu</option>
                            <option>Gombe</option>
                            <option>Imo</option>
                            <option>Jigawa</option>
                            <option>Kaduna</option>
                            <option>Kano</option>
                            <option>Katsina</option>
                            <option>Kebbi</option>
                            <option>Kogi</option>
                            <option>Kwara</option>
                            <option>Lagos</option>
                            <option>Nasarawa</option>
                            <option>Niger</option>
                            <option>Ogun</option>
                            <option>Ondo</option>
                            <option>Osun</option>
                            <option>Oyo</option>
                            <option>Plateau</option>
                            <option>Rivers</option>
                            <option>Sokoto</option>
                            <option>Taraba</option>
                            <option>Yobe</option>
                            <option>Zamfara</option>
                            <option>FCT</option>

                        </select>

                    </div>

                </div>


                <div class="form-group">

                    <label for="signupPassword">
                        Password
                    </label>

                    <div class="input-wrapper">

                        <i class="ri-lock-line"></i>

                        <input
                            type="password"
                            id="signupPassword"
                            placeholder="Create a password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="signupPassword"
                        >
                            <i class="ri-eye-line"></i>
                        </button>

                    </div>

                </div>


                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <i class="ri-lock-line"></i>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="confirmPassword"
                        >
                            <i class="ri-eye-line"></i>
                        </button>

                    </div>

                </div>


                <label class="terms">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the ML Trivia
                        student guidelines.
                    </span>

                </label>


                <div
                    id="signupMessage"
                    class="auth-message"
                ></div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Create Account
                    <i class="ri-arrow-right-line"></i>
                </button>

            </form>


            <p class="auth-footer">

                Already have an account?

                <button
                    type="button"
                    id="showLogin"
                    class="switch-btn"
                >
                    Log in
                </button>

            </p>

        </section>


        <!-- =========================
             LOGIN
        ========================== -->

        <section
            class="auth-panel"
            id="loginPanel"
        >

            <div class="auth-heading">

                <p class="eyebrow">
                    STUDENT LOGIN
                </p>

                <h2>Welcome back.</h2>

                <p>
                    Log in to continue your
                    Maths League journey.
                </p>

            </div>


            <form id="loginForm" class="auth-form">

                <div class="form-group">

                    <label for="loginEmail">
                        Email Address
                    </label>

                    <div class="input-wrapper">

                        <i class="ri-mail-line"></i>

                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>


                <div class="form-group">

                    <div class="password-label">

                        <label for="loginPassword">
                            Password
                        </label>

                        <a href="#" id="forgotPassword">
                            Forgot password?
                        </a>

                    </div>

                    <div class="input-wrapper">

                        <i class="ri-lock-line"></i>

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="password-toggle"
                            data-target="loginPassword"
                        >
                            <i class="ri-eye-line"></i>
                        </button>

                    </div>

                </div>


                <div
                    id="loginMessage"
                    class="auth-message"
                ></div>


                <button
                    type="submit"
                    class="auth-submit"
                >
                    Log In
                    <i class="ri-login-box-line"></i>
                </button>

            </form>


            <p class="auth-footer">

                Don't have an account?

                <button
                    type="button"
                    id="showSignup"
                    class="switch-btn"
                >
                    Create one
                </button>

            </p>

        </section>

    </div>

</main>


<script type="module" src="js/auth.js"></script>

</body>
</html>
