<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Quiz Result | ML Trivia</title>

    <link
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/quiz-result.css">

</head>

<body>

<main class="result-page">

    <section class="result-container">

        <div class="result-icon">
            <i class="ri-check-line"></i>
        </div>

        <p class="eyebrow">
            DAILY QUIZ COMPLETE
        </p>

        <h1>
            Well done.
        </h1>

        <p class="result-description">
            Your Daily Quiz has been submitted
            successfully.
        </p>


        <!-- SCORE -->

        <div class="score-box">

            <span>Your Score</span>

            <strong id="score">
                0 / 10
            </strong>

            <small id="points">
                0 Points
            </small>

        </div>


        <!-- STATS -->

        <div class="result-stats">

            <div>

                <span>
                    Correct
                </span>

                <strong id="correct">
                    0
                </strong>

            </div>


            <div>

                <span>
                    Total
                </span>

                <strong id="total">
                    10
                </strong>

            </div>


            <div>

                <span>
                    Accuracy
                </span>

                <strong id="accuracy">
                    0%
                </strong>

            </div>

        </div>


        <!-- ACTIONS -->

        <div class="result-actions">

            <a
                href="progress.html"
                class="result-primary"
            >
                View Progress
                <i class="ri-bar-chart-box-line"></i>
            </a>


            <a
                href="quiz.html"
                class="result-secondary"
            >
                Back to Quiz
            </a>

        </div>

    </section>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <a
            href="dashboard.html"
            class="nav-item"
        >
            <i class="ri-home-5-line"></i>
            <span>Home</span>
        </a>


        <a
            href="quiz.html"
            class="nav-item active"
        >
            <i class="ri-brain-line"></i>
            <span>Quiz</span>
        </a>


        <a
            href="progress.html"
            class="nav-item"
        >
            <i class="ri-bar-chart-box-line"></i>
            <span>Progress</span>
        </a>


        <a
            href="profile.html"
            class="nav-item"
        >
            <i class="ri-user-3-line"></i>
            <span>Profile</span>
        </a>

    </nav>

</main>


<script
    type="module"
    src="js/quiz-result.js"
></script>

</body>

</html>
