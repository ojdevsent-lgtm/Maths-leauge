<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths League Admin Dashboard</title><link rel="stylesheet" href="./admin.css"></head><body><header class="topbar"><div><strong>Maths League</strong><span>Admin Console</span></div><button id="logout">Logout</button></header><main><section class="hero"><div><p class="eyebrow">CONTROL CENTER</p><h1>Competition overview</h1><p>Manage students, quizzes, attempts and announcements.</p></div><button id="refresh">Refresh</button></section><section id="stats" class="stats"></section><section class="panel"><div class="panel-head"><h2>Create quiz</h2></div><form id="quizForm" class="form"><input id="quizTitle" required maxlength="160" placeholder="Quiz title"><textarea id="quizDescription" maxlength="1000" placeholder="Description"></textarea><input id="quizDuration" type="number" min="1" max="120" value="10" placeholder="Duration in minutes"><button type="submit">Create draft quiz</button></form><div id="quizzes" class="cards">Loading…</div></section><section id="questionPanel" class="panel" hidden><div class="panel-head"><h2 id="questionHeading">Add question</h2></div><form id="questionForm" class="form"><input id="questionText" required maxlength="1000" placeholder="Question"><input class="optionInput" required maxlength="300" placeholder="Option A"><input class="optionInput" required maxlength="300" placeholder="Option B"><input class="optionInput" maxlength="300" placeholder="Option C"><input class="optionInput" maxlength="300" placeholder="Option D"><select id="correctIndex"><option value="0">Correct answer: A</option><option value="1">Correct answer: B</option><option value="2">Correct answer: C</option><option value="3">Correct answer: D</option></select><input id="questionPoints" type="number" min="1" max="100" value="1" placeholder="Points"><input id="questionOrder" type="number" min="1" value="1" placeholder="Question number"><button type="submit">Save question</button><button id="closeQuestion" type="button">Done</button></form></section><section class="grid"><article class="panel"><div class="panel-head"><h2>Recent attempts</h2></div><div id="attempts" class="table-wrap">Loading…</div></article><article class="panel"><div class="panel-head"><h2>Students</h2><input id="studentSearch" placeholder="Search students"></div><div id="students" class="table-wrap">Loading…</div></article></section><section class="panel"><div class="panel-head"><h2>Announcements</h2></div><form id="announcementForm" class="form"><input id="announcementTitle" required maxlength="120" placeholder="Announcement title"><textarea id="announcementBody" required maxlength="1000" placeholder="Message"></textarea><button type="submit">Create announcement</button></form><div id="announcements" class="cards">Loading…</div></section><p id="error" class="error" hidden></p></main><script type="module" src="./admin.js"></script></body></html>
