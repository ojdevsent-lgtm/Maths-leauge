<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Admin Login — Maths League</title><link rel="stylesheet" href="./admin.css"><style>.admin-auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f6f7fb}.admin-auth-card{width:min(440px,100%);background:#fff;border:1px solid #e7eaf0;border-radius:18px;padding:28px;box-shadow:0 12px 35px rgba(23,32,51,.08)}.admin-auth-card h1{margin:4px 0 8px;font-size:32px}.admin-auth-card p{color:#687389}.admin-auth-brand{font-weight:800;color:#172033}.admin-auth-form{display:grid;gap:12px;margin-top:22px}.admin-auth-form label{font-size:13px;font-weight:700}.admin-auth-form input{width:100%;margin-top:6px;border:1px solid #dfe3eb;border-radius:10px;padding:12px;font:inherit}.admin-auth-form button{border:0;border-radius:10px;padding:13px;background:#172033;color:#fff;font-weight:800;font-size:15px}.admin-auth-message{min-height:20px;margin:4px 0 0!important;font-size:13px}.admin-auth-back{display:inline-block;margin-top:18px;color:#172033;font-size:13px;font-weight:700;text-decoration:none}</style></head><body><main class="admin-auth"><section class="admin-auth-card"><span class="eyebrow">MATHS LEAGUE · ADMIN</span><h1>Administrator sign in</h1><p>Sign in with an administrator account to access the competition control center.</p><form id="adminLoginForm" class="admin-auth-form" novalidate><label>Email<input id="email" type="email" autocomplete="username" required placeholder="Administrator email"></label><label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Password"></label><button type="submit">Sign in to Admin</button><p id="adminAuthMessage" class="admin-auth-message" role="status"></p></form><a class="admin-auth-back" href="../index.html">← Back to Maths League</a></section></main><script type="module" src="./login.js"></script></body></html>
