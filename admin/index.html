<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maths League Admin</title><link rel="stylesheet" href="./admin.css"></head><body><header class="topbar"><div><strong>Maths League</strong><span>Admin Console</span></div><button id="logout">Logout</button></header><main><section class="hero"><div><p class="eyebrow">CONTROL CENTER</p><h1>Competition overview</h1><p>Manage students, monitor attempts and control announcements from one place.</p></div><button id="refresh">Refresh</button></section><section id="stats" class="stats"></section><section class="grid"><article class="panel"><div class="panel-head"><h2>Recent attempts</h2></div><div id="attempts" class="table-wrap">Loading…</div></article><article class="panel"><div class="panel-head"><h2>Students</h2><input id="studentSearch" placeholder="Search students"></div><div id="students" class="table-wrap">Loading…</div></article></section><section class="panel"><div class="panel-head"><h2>Announcements</h2></div><form id="announcementForm" class="form"><input id="announcementTitle" required maxlength="120" placeholder="Announcement title"><textarea id="announcementBody" required maxlength="1000" placeholder="Message"></textarea><button type="submit">Create announcement</button></form><div id="announcements" class="cards">Loading…</div></section><p id="error" class="error" hidden></p></main><script type="module" src="./admin.js"></script></body></html>
